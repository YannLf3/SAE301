<section class="mx-auto max-w-360 px-page-gutter pt-ui-24 pb-ui-64 md:pt-ui-40" aria-labelledby="titre-auth">
  <slot name="etapes"></slot>

  <h1 id="titre-auth" class="mt-ui-32 text-page-title font-semibold text-text-primary">{{titre}}</h1>
  <p class="mt-ui-4 text-body text-text-secondary">{{description}}</p>

  <div data-slot="grille" class="mt-ui-24 grid items-start gap-ui-24 md:mt-ui-32 lg:grid-cols-[minmax(0,1fr)_24.375rem]">
    <div class="flex flex-col gap-ui-16">
      <div class="rounded-ui-12 border border-border-default bg-surface-card p-card-padding md:p-ui-24">
        <slot name="onglets"></slot>
        <slot name="message"></slot>
        <slot name="formulaire"></slot>
      </div>
      <slot name="information"></slot>
      <a href="{{retour_href}}" data-link class="inline-flex min-h-11 items-center px-ui-16 text-body font-medium text-text-brand underline-offset-4 hover:underline focus-visible:outline-2 focus-visible:outline-border-focus">{{retour_libelle}}</a>
    </div>

    <slot name="recapitulatif"></slot>
  </div>
</section>
