<div class="inline-flex h-11 items-center rounded-ui-8 border border-border-default" role="group" aria-label="{{libelle}}">
  <button type="button" data-action="diminuer" aria-label="Diminuer la quantité" class="flex size-11 items-center justify-center rounded-ui-8 text-text-primary transition-colors hover:bg-surface-subtle focus-visible:outline-2 focus-visible:outline-border-focus disabled:cursor-not-allowed disabled:text-text-disabled disabled:hover:bg-transparent">
    <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-width="2" d="M5 12h14" /></svg>
  </button>
  <span class="min-w-8 text-center text-body text-text-primary" aria-label="Quantité : {{quantite}}">{{quantite}}</span>
  <button type="button" data-action="augmenter" aria-label="Augmenter la quantité" class="flex size-11 items-center justify-center rounded-ui-8 text-text-primary transition-colors hover:bg-surface-subtle focus-visible:outline-2 focus-visible:outline-border-focus disabled:cursor-not-allowed disabled:text-text-disabled disabled:hover:bg-transparent">
    <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-width="2" d="M12 5v14M5 12h14" /></svg>
  </button>
</div>
