<header class="sticky top-0 z-30 w-full border-b border-border-default bg-surface-default">
  <div class="mx-auto flex h-16 max-w-360 items-center justify-between gap-ui-16 px-page-gutter lg:h-20">
    <div class="flex items-center gap-ui-4">
      <!-- Menu hamburger : mobile et tablette -->
      <button
        type="button"
        data-action="toggle-menu"
        aria-expanded="false"
        aria-controls="mobile-nav"
        aria-label="Ouvrir le menu"
        class="-ml-ui-12 flex size-11 items-center justify-center rounded-ui-8 text-text-primary transition-colors hover:bg-surface-subtle focus-visible:outline-2 focus-visible:outline-border-focus lg:hidden"
      >
        <svg class="size-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

      <a href="/" data-link aria-label="dji, accueil" class="flex size-11 items-center justify-center rounded-ui-8 text-2xl font-semibold text-text-primary italic focus-visible:outline-2 focus-visible:outline-border-focus">dji</a>
    </div>

    <!-- Catégories : desktop (Figma 1440 et tablette paysage 1024) -->
    <nav class="hidden lg:block" aria-label="Catégories">
      <ul class="flex items-center gap-ui-24">
        <slot name="categories"></slot>
      </ul>
    </nav>

    <!-- Compte et panier -->
    <div class="flex items-center gap-ui-4">
      <a href="/connexion" data-link aria-label="Se connecter" class="flex h-11 items-center gap-ui-8 rounded-ui-8 px-ui-8 text-label text-text-primary transition-colors hover:text-text-brand focus-visible:outline-2 focus-visible:outline-border-focus">
        <svg class="size-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4" stroke-width="1.8" />
          <path stroke-linecap="round" stroke-width="1.8" d="M4 21a8 8 0 0116 0" />
        </svg>
        <span class="hidden sm:inline">Se connecter</span>
      </a>

      <a href="/panier" data-link aria-label="Voir le panier" class="flex h-11 items-center gap-ui-6 rounded-ui-8 px-ui-8 text-text-primary transition-colors hover:text-text-brand focus-visible:outline-2 focus-visible:outline-border-focus">
        <svg class="size-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M6 2 3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4zM3 6h18M16 10a4 4 0 01-8 0" />
        </svg>
        <span data-slot="cart-count" class="text-label font-semibold text-text-brand">0</span>
      </a>
    </div>
  </div>

  <!-- Menu déroulant : mobile et tablette -->
  <div id="mobile-nav" class="hidden border-t border-border-default bg-surface-default px-page-gutter py-ui-12 lg:hidden">
    <nav aria-label="Catégories (menu)">
      <ul class="flex flex-col">
        <slot name="categories-menu"></slot>
      </ul>
    </nav>
  </div>
</header>
