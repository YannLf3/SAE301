<header
  class="border-border-default bg-surface-default sticky top-0 z-30 w-full border-b"
>
  <div
    class="gap-ui-16 px-page-gutter mx-auto flex h-16 max-w-360 items-center justify-between lg:h-20"
  >
    <div class="gap-ui-4 flex items-center">
      <a
        href="/"
        data-link
        aria-label="dji, accueil"
        class="rounded-ui-8 text-text-primary focus-visible:outline-border-focus flex size-11 items-center justify-center text-2xl font-semibold italic focus-visible:outline-2"
        >dji</a
      >
    </div>

    <!-- Navigation principale : le filtre par catégorie est dans la page catalogue -->
    <nav aria-label="Navigation principale">
      <a
        href="/"
        data-link
        class="text-body text-text-primary hover:text-text-brand focus-visible:outline-border-focus aria-[current=page]:text-text-brand rounded-ui-8 px-ui-8 flex h-11 items-center transition-colors focus-visible:outline-2 aria-[current=page]:font-semibold"
        >Catalogue</a
      >
    </nav>

    <!-- Compte et panier -->
    <div class="gap-ui-4 flex items-center">
      <!-- Utilisateur connecté : prénom et déconnexion (affiché par HeaderView) -->
      <div data-slot="session" class="gap-ui-4 hidden items-center">
        <span data-slot="prenom" class="text-label text-text-primary px-ui-8 max-w-32 truncate"></span>
        <button
          type="button"
          data-action="deconnexion"
          class="rounded-ui-8 px-ui-8 text-label text-text-primary hover:text-text-brand focus-visible:outline-border-focus flex h-11 items-center transition-colors focus-visible:outline-2"
        >
          Se déconnecter
        </button>
      </div>

      <a
        href="/connexion"
        data-link
        data-slot="connexion"
        aria-label="Se connecter"
        class="gap-ui-8 rounded-ui-8 px-ui-8 text-label text-text-primary hover:text-text-brand focus-visible:outline-border-focus flex h-11 items-center transition-colors focus-visible:outline-2"
      >
        <svg
          class="size-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <circle cx="12" cy="8" r="4" stroke-width="1.8" />
          <path
            stroke-linecap="round"
            stroke-width="1.8"
            d="M4 21a8 8 0 0116 0"
          />
        </svg>
        <span class="hidden sm:inline">Se connecter</span>
      </a>

      <a
        href="/panier"
        data-link
        aria-label="Voir le panier"
        class="gap-ui-6 rounded-ui-8 px-ui-8 text-text-primary hover:text-text-brand focus-visible:outline-border-focus flex h-11 items-center transition-colors focus-visible:outline-2"
      >
        <svg
          class="size-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.8"
            d="M6 2 3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4zM3 6h18M16 10a4 4 0 01-8 0"
          />
        </svg>
        <span
          data-slot="cart-count"
          class="text-label text-text-brand font-semibold"
          >0</span
        >
      </a>
    </div>
  </div>

</header>
