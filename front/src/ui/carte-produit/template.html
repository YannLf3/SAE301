<article class="relative flex flex-col gap-ui-12 rounded-ui-12 border border-border-default bg-surface-card p-ui-12 transition-shadow hover:shadow-md sm:p-ui-16">
  <div class="aspect-4/3 overflow-hidden rounded-ui-8 bg-surface-subtle">
    <img
      src="{{image}}"
      alt="{{nom}}"
      width="800"
      height="600"
      loading="lazy"
      decoding="async"
      class="size-full object-contain p-ui-8"
    />
  </div>

  <div class="flex flex-col gap-ui-4">
    <h2 class="text-heading-sm font-semibold text-text-primary">{{nom}}</h2>
    <p class="text-body font-semibold text-text-primary">
      <span class="text-caption font-normal text-text-secondary">À partir de </span><span class="text-heading-md">{{prix}}</span>
    </p>
    <p class="text-caption text-text-secondary sm:text-label">{{description}}</p>
  </div>

  <p data-role="stock" class="inline-flex w-fit items-center gap-ui-6 rounded-ui-14 border px-ui-8 py-ui-4 text-caption">
    <span data-role="pastille" class="size-2 rounded-full bg-current" aria-hidden="true"></span>
    {{stock}}
  </p>

  <p class="text-caption text-text-muted">{{retrait}}</p>

  <a
    href="/produits/{{slug}}"
    data-link
    class="mt-auto flex h-11 items-center justify-center rounded-ui-8 bg-action-primary-bg px-ui-12 text-body font-semibold text-action-primary-text transition-colors hover:bg-action-hover focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-border-focus after:absolute after:inset-0 after:content-['']"
  >Voir le produit<span class="sr-only"> : {{nom}}</span></a>
</article>
