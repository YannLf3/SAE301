<form class="flex flex-col gap-ui-16" aria-busy="false">
  <div class="flex flex-col gap-ui-8">
    <label for="connexion-email" class="text-label font-medium text-text-primary">Adresse e-mail</label>
    <input id="connexion-email" name="email" type="email" required autocomplete="email" value="{{email}}" class="h-12 w-full rounded-ui-8 border border-border-default bg-surface-default px-ui-16 text-body text-text-primary transition-colors hover:border-border-strong focus-visible:outline-2 focus-visible:outline-border-focus" />
  </div>

  <slot name="mdp"></slot>

  <button type="button" disabled aria-disabled="true" title="Bientôt disponible" class="min-h-11 w-fit px-ui-8 text-body font-medium text-text-disabled">Mot de passe oublié ?</button>

  <button type="submit" class="flex h-12 w-full items-center justify-center rounded-ui-8 bg-action-primary-bg px-button-padding text-body font-medium text-action-primary-text transition-colors hover:bg-action-hover disabled:cursor-wait disabled:opacity-60 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-border-focus">{{libelle_bouton}}</button>
  <p class="text-caption text-text-secondary">Vos données servent à vous informer de la préparation et du retrait de votre commande.</p>
</form>
