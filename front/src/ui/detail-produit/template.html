<article class="grid gap-ui-32 md:grid-cols-2">
  <div class="aspect-4/3 overflow-hidden rounded-ui-12 bg-surface-subtle">
    <img
      src="{{image}}"
      alt="{{nom}}"
      width="800"
      height="600"
      decoding="async"
      class="size-full object-contain p-ui-16"
    />
  </div>

  <div class="flex flex-col gap-ui-16">
    <p class="text-caption text-text-muted">{{categorie}}</p>
    <h1 class="text-page-title font-semibold text-text-primary">{{nom}}</h1>
    <p class="text-body text-text-secondary">{{description}}</p>
    <p class="text-heading-md font-semibold text-text-primary">{{prix}}</p>
    <p data-role="stock" class="text-label font-medium">{{stock}}</p>

    <h2 class="pt-ui-8 text-heading-sm font-medium text-text-primary">Configurations</h2>
    <ul class="flex flex-col gap-ui-8">
      <slot name="variantes"></slot>
    </ul>
  </div>
</article>
